  function handleDischargingFileSelected(event) {

    const file = event.target.files[0];

    if (!file) {
      return;
    }


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    if (!["xlsx", "xls"].includes(extension)) {

      showToast(
        "File harus Excel (.xlsx atau .xls).",
        "error"
      );

      event.target.value = "";

      return;
    }


    const maxSize =
      10 * 1024 * 1024;


    if (file.size > maxSize) {

      showToast(
        "Ukuran file maksimal 10 MB.",
        "error"
      );

      event.target.value = "";

      return;
    }


    dischargingState.file =
      file;

    dischargingState.result =
      null;


    const resultRoot =
      document.getElementById(
        "dischargingResult"
      );


    if (resultRoot) {
      resultRoot.innerHTML = "";
    }


    const preview =
      document.getElementById(
        "dischargingFilePreview"
      );


    if (preview) {

      preview.classList.remove(
        "hidden"
      );


      preview.innerHTML = `

  // ============================================================
  // UPLOAD FILE
  // ============================================================

  async function uploadDischargingFile() {

    const file =
      dischargingState.file;


    if (!file) {

      showToast(
        "Pilih file terlebih dahulu.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById(
        "uploadDischargingButton"
      );


    const buttonText =
      document.getElementById(
        "uploadDischargingButtonText"
      );


    const buttonIcon =
      document.getElementById(
        "uploadDischargingButtonIcon"
      );


    if (button) {
      button.disabled = true;
    }


    if (buttonText) {
      buttonText.textContent =
        "Processing...";
    }


    if (buttonIcon) {

      buttonIcon.outerHTML = `
        <span
          id="uploadDischargingButtonIcon"
          class="loader"
        ></span>
      `;
    }


    try {

      // ========================================================
      // FILE → BASE64
      // ========================================================

      const base64 =
        await fileToBase64(file);


      // ========================================================
      // PAYLOAD
      // ========================================================

      const payload = {

        fileName:
          file.name,

        mimeType:
          file.type ||
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",

        base64:
          base64,

        user: {

          email:
            state.session?.email || "",

          uid:
            state.session?.uid || "",

          partnerId:
            state.session?.partnerId || "",

          partnerName:
            state.session?.partnerName || ""
        },

        userAgent:
          navigator.userAgent || ""
      };


      console.log(
        "DISCHARGING REQUEST:",
        {
          fileName:
            payload.fileName,

          mimeType:
            payload.mimeType,

          user:
            payload.user
        }
      );


      // ========================================================
      // CALL APPS SCRIPT
      // ========================================================

      const response =
        await runDischargingServer(
          payload
        );


      console.log(
        "DISCHARGING RESPONSE:",
        response
      );


      // ========================================================
      // EMPTY RESPONSE
      // ========================================================

      if (!response) {

        throw new Error(
          "Tidak ada response dari server."
        );
      }


      // ========================================================
      // TECHNICAL ERROR
      // ========================================================

      if (
        response.status === "error" ||
        (
          response.success === false &&
          response.error_code
        )
      ) {

        console.error(
          "DISCHARGING BACKEND ERROR:",
          response
        );


        throw new Error(
          response.detail ||
          response.message ||
          "Discharging List gagal diproses."
        );
      }


      // ========================================================
      // NORMALIZE RESULT
      // ========================================================

      const result =
        response.data &&
        typeof response.data === "object"
          ? response.data
          : response;


      console.log(
        "DISCHARGING NORMALIZED RESULT:",
        result
      );


      if (
        !result ||
        typeof result !== "object"
      ) {

        throw new Error(
          "Format response Discharging List tidak valid."
        );
      }


      // ========================================================
      // SAVE RESULT
      // ========================================================

      dischargingState.result =
        result;


      // ========================================================
      // RENDER RESULT
      // ========================================================

      renderDischargingResult(
        result
      );


      // ========================================================
      // DETERMINE RESULT
      // ========================================================

      const totalRows =
        Number(
          result.total_rows || 0
        );


      const createdCount =
        Number(
          result.created_count || 0
        );


      const rejectedCount =
        Number(
          result.rejected_count || 0
        );


      const isPartial =
        createdCount > 0 &&
        rejectedCount > 0;


      const isRejected =
        createdCount === 0 &&
        rejectedCount > 0;


      const isSuccess =
        createdCount > 0 &&
        rejectedCount === 0;


      // ========================================================
      // TOAST
      // ========================================================

      if (isPartial) {

        showToast(
          result.message ||
          `${createdCount} dari ${totalRows} container berhasil diproses.`,
          "warning"
        );

      }

      else if (isRejected) {

        showToast(
          result.message ||
          "Tidak ada container yang dapat diproses.",
          "error"
        );

      }

      else if (isSuccess) {

        showToast(
          result.message ||
          "Discharging List berhasil diproses.",
          "success"
        );

      }

      else {

        showToast(
          result.message ||
          "Discharging List selesai diproses.",
          "warning"
        );
      }


    } catch (error) {

      console.error(
        "UPLOAD DISCHARGING ERROR:",
        error
      );


      showToast(
        error &&
        error.message
          ? error.message
          : "Upload Discharging List gagal.",
        "error"
      );


    } finally {

      if (button) {
        button.disabled = false;
      }


      if (buttonText) {

        buttonText.textContent =
          "Upload & Validate";
      }


      const currentIcon =
        document.getElementById(
          "uploadDischargingButtonIcon"
        );


      if (currentIcon) {

        currentIcon.outerHTML = `

          <i
            id="uploadDischargingButtonIcon"
            data-lucide="send"
            class="
              h-5
              w-5
              transition
              group-hover:translate-x-0.5
            "
          ></i>
        `;
      }


      refreshIcons();
    }
  }


  // ============================================================
  // APPS SCRIPT CALL
  // ============================================================

  function runDischargingServer(payload) {

    return new Promise(
      function(resolve, reject) {

        google.script.run

          .withSuccessHandler(
            function(response) {

              resolve(response);
            }
          )

          .withFailureHandler(
            function(error) {

              reject(
                new Error(
                  error &&
                  error.message
                    ? error.message
                    : String(error)
                )
              );
            }
          )

          .uploadDischargingList(
            payload
          );
      }
    );
  }

  // ============================================================
  // FILE → BASE64
  // ============================================================

  function fileToBase64(file) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();


        reader.onload =
          function() {

            const result =
              String(
                reader.result || ""
              );


            resolve(
              result.includes(",")
                ? result.split(",")[1]
                : result
            );
          };


        reader.onerror =
          function() {

            reject(
              new Error(
                "File gagal dibaca."
              )
            );
          };


        reader.readAsDataURL(
          file
        );
      }
    );
  }


  // ============================================================
  // FILE SIZE
  // ============================================================

  function formatDischargingFileSize(bytes) {

    if (bytes < 1024) {
      return bytes + " B";
    }


    if (
      bytes <
      1024 * 1024
    ) {

      return (
        bytes / 1024
      ).toFixed(1) + " KB";
    }


    return (
      bytes /
      (1024 * 1024)
    ).toFixed(1) + " MB";
  }
