  function handleDischargingFileSelected(event) {

      showToast(
        "File harus Excel (.xlsx atau .xls) atau PDF (.pdf).",
        "error"
      );

      event.target.value = "";

      return;
    }


    const maxSize =
      10 * 1024 * 1024;

      showToast(
        "Ukuran file maksimal 10 MB.",
        "error"
      );

  // ============================================================

  async function uploadDischargingFile() {

    const file =
      dischargingState.file;


    if (!file) {

      showToast(
        "Pilih file terlebih dahulu.",
        "error"
      );

      return;
    }


    const button = document.getElementById("uploadDischargingButton");
    const parsePdfButton = document.getElementById("parsePdfButton");
    const buttonText = document.getElementById("uploadDischargingButtonText");
    const parsePdfButtonText = document.getElementById("parsePdfButtonText");
    const buttonIcon = document.getElementById("uploadDischargingButtonIcon");
    const parsePdfButtonIcon = document.getElementById("parsePdfButtonIcon");

    const isPdf = file.name.toLowerCase().endsWith(".pdf");

    if (isPdf) {
      if (parsePdfButton) parsePdfButton.disabled = true;
      if (parsePdfButtonText) parsePdfButtonText.textContent = "Parsing...";
      if (parsePdfButtonIcon) {
        parsePdfButtonIcon.outerHTML = `<span id="parsePdfButtonIcon" class="loader"></span>`;
      }
    } else {
      if (button) button.disabled = true;
      if (buttonText) buttonText.textContent = "Processing...";
      if (buttonIcon) {
        buttonIcon.outerHTML = `<span id="uploadDischargingButtonIcon" class="loader"></span>`;
      }
    }


    try {

      // ========================================================
      // BUILD PAYLOAD
      // ========================================================

      const payload = {
        fileName: file.name,
        mimeType: file.type || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        base64: await fileToBase64(file),
        user: {
          email: state.session?.email || "",
          uid: state.session?.uid || "",
          partnerId: state.session?.partnerId || "",
          partnerName: state.session?.partnerName || ""
        },
        userAgent: navigator.userAgent || ""
      };


      console.log(
        "DISCHARGING REQUEST:",
        {
          fileName:
            payload.fileName,

          mimeType:
            payload.mimeType,

          user:
            payload.user
        }
      );


      // ========================================================
      // CALL APPS SCRIPT
      // ========================================================

      const response =
        await runDischargingServer(
          payload
        );


      console.log(
        "DISCHARGING RESPONSE:",
        response
      );


      // ========================================================
      // EMPTY RESPONSE
      // ========================================================

      if (!response) {

        throw new Error(
          "Tidak ada response dari server."
        );
      }


      // ========================================================
      // TECHNICAL ERROR
      // ========================================================

      if (
        response.status === "error" ||
        (
          response.success === false &&
          response.error_code
        )
      ) {

        console.error(
          "DISCHARGING BACKEND ERROR:",
          response
        );


        throw new Error(
          response.detail ||
          response.message ||
          "Discharging List gagal diproses."
        );
      }


      // ========================================================
      // NORMALIZE RESULT
      // ========================================================

      const result =
        response.data &&
        typeof response.data === "object"
          ? response.data
          : response;


      console.log(
        "DISCHARGING NORMALIZED RESULT:",
        result
      );


      if (
        !result ||
        typeof result !== "object"
      ) {

        throw new Error(
          "Format response Discharging List tidak valid."
        );
      }


      // ========================================================
      // SAVE RESULT
      // ========================================================

      dischargingState.result =
        result;


      // ========================================================
      // RENDER RESULT
      // ========================================================

      renderDischargingResult(
        result
      );


      // ========================================================
      // DETERMINE RESULT
      // ========================================================

      const totalRows =
        Number(
          result.total_rows || 0
        );


      const createdCount =
        Number(
          result.created_count || 0
        );


      const rejectedCount =
        Number(
          result.rejected_count || 0
        );


      const isPartial =
        createdCount > 0 &&
        rejectedCount > 0;


      const isRejected =
        createdCount === 0 &&
        rejectedCount > 0;


      const isSuccess =
        createdCount > 0 &&
        rejectedCount === 0;


      // ========================================================
      // TOAST
      // ========================================================

      if (isPartial) {

        showToast(
          result.message ||
          `${createdCount} dari ${totalRows} container berhasil diproses.`,
          "warning"
        );

      }

      else if (isRejected) {

        showToast(
          result.message ||
          "Tidak ada container yang dapat diproses.",
          "error"
        );

      }

      else if (isSuccess) {

        showToast(
          result.message ||
          "Discharging List berhasil diproses.",
          "success"
        );

      }

      else {

        showToast(
          result.message ||
          "Discharging List selesai diproses.",
          "warning"
        );
      }


    } catch (error) {

      console.error(
        "UPLOAD DISCHARGING ERROR:",
        error
      );


      showToast(
        error &&
        error.message
          ? error.message
          : "Upload Discharging List gagal.",
        "error"
      );


    } finally {

      if (isPdf) {
        if (parsePdfButton) parsePdfButton.disabled = false;
        if (parsePdfButtonText) parsePdfButtonText.textContent = "Parse PDF & Validate";
        
        const currentParseIcon = document.getElementById("parsePdfButtonIcon");
        if (currentParseIcon) {
          currentParseIcon.outerHTML = `
            <i id="parsePdfButtonIcon" data-lucide="file-search" class="h-5 w-5 transition group-hover:translate-x-0.5"></i>
          `;
        }
      } else {
        if (button) button.disabled = false;
        if (buttonText) buttonText.textContent = "Upload & Validate";
        
        const currentIcon = document.getElementById("uploadDischargingButtonIcon");
        if (currentIcon) {
          currentIcon.outerHTML = `
            <i id="uploadDischargingButtonIcon" data-lucide="send" class="h-5 w-5 transition group-hover:translate-x-0.5"></i>
          `;
        }
      }


      refreshIcons();
    }
  }


  // ============================================================
  // APPS SCRIPT CALL
  // ============================================================

  function runDischargingServer(payload) {

    return new Promise(
      function(resolve, reject) {

        google.script.run

          .withSuccessHandler(
            function(response) {

              resolve(response);
            }
          )

          .withFailureHandler(
            function(error) {

              reject(
                new Error(
                  error &&
                  error.message
                    ? error.message
                    : String(error)
                )
              );
            }
          )

          .uploadDischargingList(
            payload
          );
      }
    );
  }


  // ============================================================
  // CLIENT SIDE PDF PARSER (PDF.JS)
  // ============================================================
  //
  // CATATAN PERBAIKAN:
  //
  // Bug lama: textContent.items di-join dengan spasi untuk SATU HALAMAN
  // PENUH, dan "\n" hanya ditambahkan SEKALI di akhir halaman. Akibatnya
  // seluruh isi halaman (header + 8 baris kontainer + footer) menjadi
  // SATU baris raksasa. Saat di-parse per baris, hanya kontainer PERTAMA
  // yang ketemu (containerMatch di-non-global), size/type juga salah
  // ambil karena dicari di seluruh teks halaman yang sudah dibersihkan
  // dari semua spasi -> bisa nyangkut ke digit/kode yang salah.
  //
  // Perbaikan: rekonstruksi baris berdasarkan posisi Y tiap item teks
  // dari PDF.js (item.transform[5]), lalu urutkan item dalam satu baris
  // berdasarkan posisi X (item.transform[4]). Ini menghasilkan teks yang
  // strukturnya jauh lebih dekat dengan tampilan visual PDF, sehingga
  // setiap baris tabel kontainer benar-benar terpisah oleh "\n".
  // ============================================================

  function groupPdfTextItemsIntoLines(items, yTolerance) {
    yTolerance = yTolerance || 3;

    if (!items || items.length === 0) return [];

    // Urutkan dulu top-to-bottom (Y besar -> kecil di koordinat PDF),
    // lalu left-to-right (X kecil -> besar) sebagai tie-breaker awal.
    var sorted = items.slice().sort(function(a, b) {
      var dy = b.transform[5] - a.transform[5];
      if (Math.abs(dy) > yTolerance) return dy;
      return a.transform[4] - b.transform[4];
    });

    var lines = [];
    var currentLine = [];
    var currentY = null;

    for (var i = 0; i < sorted.length; i++) {
      var item = sorted[i];
      var y = item.transform[5];

      if (currentY === null || Math.abs(y - currentY) <= yTolerance) {
        currentLine.push(item);
        if (currentY === null) currentY = y;
      } else {
        lines.push(currentLine);
        currentLine = [item];
        currentY = y;
      }
    }
    if (currentLine.length > 0) lines.push(currentLine);

    return lines.map(function(lineItems) {
      var ordered = lineItems.slice().sort(function(a, b) {
        return a.transform[4] - b.transform[4];
      });
      return ordered
        .map(function(it) { return it.str; })
        .join(" ")
        .replace(/\s+/g, " ")
        .trim();
    }).filter(function(lineText) { return lineText.length > 0; });
  }

  async function extractPdfTextWithLines(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const lines = groupPdfTextItemsIntoLines(textContent.items, 3);
      fullText += lines.join("\n") + "\n";
    }

    return fullText;
  }

  function parseDischargingAdviceTextClient(text) {
    var result = {
      header: {},
      containers: []
    };

    // Header: sekarang baris sudah benar-benar terpisah oleh "\n",
    // jadi cukup ambil sisa teks sampai akhir baris ([^\n]+) tanpa
    // resiko "bocor" ke label/field berikutnya.
    var vesselMatch = text.match(/Vessel\s*\/\s*Voyage\s+([^\n]+)/i);
    if (vesselMatch) result.header.vesselVoyage = vesselMatch[1].trim();

    var polPodMatch = text.match(/POL\s*-\s*POD\s*:?\s*([^\n]+)/i);
    if (polPodMatch) result.header.polPod = polPodMatch[1].trim();

    var tdVesselMatch = text.match(/TD\s*Vessel\s*:?\s*([^\n]+)/i);
    if (tdVesselMatch) result.header.tdVessel = tdVesselMatch[1].trim();

    var etaVesselMatch = text.match(/ETA\s*Vessel\s*:?\s*([^\n]+)/i);
    if (etaVesselMatch) result.header.etaVessel = etaVesselMatch[1].trim();

    // Principal: diambil dari baris "TO : <nama perusahaan>" di kop surat.
    // Dianchor ke AWAL BARIS (^...\b) supaya tidak salah nyangkut ke kata
    // lain yang kebetulan diawali "TO" (mis. "TOTAL"). Multiline flag "m"
    // dibutuhkan karena "^" harus cocok di tiap baris, bukan cuma awal teks.
    var principalMatch = text.match(/^TO\b\s*:?\s*([^\n]+)/im);
    if (principalMatch) result.header.principal = principalMatch[1].trim();

    // Kontainer: proses PER BARIS (bukan seluruh halaman), dan cari
    // size/type dari token SETELAH nomor kontainer pada baris yang
    // sama saja -- bukan dari string gabungan tanpa spasi yang bisa
    // salah nyangkut ke digit dari nomor kontainer/seal itu sendiri.
    var lines = text.split('\n');

    for (var i = 0; i < lines.length; i++) {
      var rawLine = lines[i].trim();
      if (!rawLine) continue;

      var tokens = rawLine.split(/\s+/);
      var containerNo = null;
      var containerIdx = -1;

      for (var t = 0; t < tokens.length; t++) {
        var cleanToken = tokens[t].replace(/[^A-Za-z0-9]/g, '');
        var m = cleanToken.match(/^([A-Z]{4}\d{7})/i);
        if (m) {
          containerNo = m[1].toUpperCase();
          containerIdx = t;
          break;
        }
      }

      if (!containerNo) continue;

      var exists = result.containers.some(function(c) {
        return c.containerNo === containerNo;
      });
      if (exists) continue;

      var size = "";
      var type = "";
      var restTokens = tokens.slice(containerIdx + 1);

      for (var r = 0; r < restTokens.length; r++) {
        var tok = restTokens[r];
        if (!size && /^(20|40|45)$/.test(tok)) size = tok;
        if (!type && /^(GP|HC|RF|OT|FR|TK|HQ)$/i.test(tok)) type = tok.toUpperCase();
        if (size && type) break;
      }

      result.containers.push({
        containerNo: containerNo,
        size: size,
        type: type,
        rawLine: rawLine
      });
    }

    return result;
  }

  async function submitParsedDischarging() {
    const btn = document.getElementById("submitParsedButton");
    const btnText = document.getElementById("submitParsedText");
    const btnIcon = document.getElementById("submitParsedIcon");

    if (btn) btn.disabled = true;
    if (btnText) btnText.textContent = "Mengirim...";
    if (btnIcon) btnIcon.outerHTML = `<span id="submitParsedIcon" class="loader"></span>`;

    try {
      // Build Header
      const parsedHeader = {
        vesselVoyage: document.getElementById("headerVesselVoyage")?.value || "",
        polPod: document.getElementById("headerPolPod")?.value || "",
        tdVessel: document.getElementById("headerTdVessel")?.value || "",
        etaVessel: document.getElementById("headerEtaVessel")?.value || "",
        principal: document.getElementById("headerPrincipal")?.value || ""
      };

      // Build Containers
      const parsedContainers = [];
      const containerNos = document.getElementsByName("containerNo[]");
      const sizes = document.getElementsByName("size[]");
      const types = document.getElementsByName("type[]");

      for (let i = 0; i < containerNos.length; i++) {
        const cNo = containerNos[i].value.trim();
        if (cNo) {
          parsedContainers.push({
            containerNo: cNo,
            size: sizes[i].value.trim(),
            type: types[i].value.trim()
          });
        }
      }

      const fileName = document.getElementById("parsedFileName")?.value || "ParsedDischarging.pdf";

      const payload = {
        fileName: fileName,
        mimeType: "application/pdf",
        base64: "", // No base64
        isParsed: true,
        parsedHeader: parsedHeader,
        parsedContainers: parsedContainers,
        user: {
          email: state.session?.email || "",
          uid: state.session?.uid || "",
          partnerId: state.session?.partnerId || "",
          partnerName: state.session?.partnerName || ""
        },
        userAgent: navigator.userAgent || ""
      };

      console.log("SUBMIT PARSED REQUEST:", payload);

      const response = await runDischargingServer(payload);
      console.log("SUBMIT PARSED RESPONSE:", response);

      if (!isSuccessResponse(response)) {
        throw new Error(
          response && response.message
            ? response.message
            : "Upload (Parsed) gagal."
        );
      }

      showToast("Data berhasil dikirim!", "success");
      document.getElementById("dischargingParsedForm").classList.add("hidden");
      renderDischargingResult(response.data || {});

    } catch (error) {
      console.error(error);
      showToast(error.message || String(error), "error");
    } finally {
      if (btn) btn.disabled = false;
      if (btnText) btnText.textContent = "Submit ke n8n";
      const icon = document.getElementById("submitParsedIcon");
      if (icon) {
         icon.outerHTML = `<i id="submitParsedIcon" data-lucide="send" class="h-4 w-4"></i>`;
      }
      refreshIcons();
    }
  }

  // ============================================================
  // FILE → BASE64
  // ============================================================

  function fileToBase64(file) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();


        reader.onload =
          function() {

            const result =
              String(
                reader.result || ""
              );


            resolve(
              result.includes(",")
                ? result.split(",")[1]
                : result
            );
          };


        reader.onerror =
          function() {

            reject(
              new Error(
                "File gagal dibaca."
              )
            );
          };


        reader.readAsDataURL(
          file
        );
      }
    );
  }


  // ============================================================
  // FILE SIZE
  // ============================================================

  function formatDischargingFileSize(bytes) {

    if (bytes < 1024) {
      return bytes + " B";
    }


    if (
      bytes <
      1024 * 1024
    ) {

      return (
        bytes / 1024
      ).toFixed(1) + " KB";
    }


    return (
      bytes /
      (1024 * 1024)
    ).toFixed(1) + " MB";
  }
