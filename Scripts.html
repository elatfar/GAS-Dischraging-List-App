<script>
  const STORAGE_KEY = "containerDepotPortal.session.v3";

  const state = {
    config: null,
    menus: [],
    session: null,
    activeRoute: ""
  };

  // ============================================================
  // EVENT LISTENERS
  // ============================================================

  document.addEventListener("DOMContentLoaded", boot);

  
  // ============================================================
  // DASHBOARD BROWSER BACK GUARD
  // Setelah login, browser Back tidak boleh keluar dari Web App.
  // Menu internal tetap bisa Back ke Dashboard.
  // ============================================================
  let dashboardBackGuardReady = false;

  function installDashboardBackGuard_() {
    if (dashboardBackGuardReady) return;

    try {
      history.replaceState(
        { route: "home", dashboardRoot: true },
        "",
        window.location.href
      );

      history.pushState(
        { route: "home", dashboardGuard: true },
        "",
        window.location.href
      );

      dashboardBackGuardReady = true;
    } catch (error) {
      console.warn("Dashboard history guard gagal dipasang:", error);
    }
  }

  function resetDashboardBackGuard_() {
    dashboardBackGuardReady = false;
  }

window.addEventListener("popstate", function(event) {
    if (!state.session) {
      renderLogin();
      return;
    }

    const route =
      event.state && typeof event.state.route === "string"
        ? event.state.route
        : getRouteFromUrl();

    renderRoute(route, false);
  });

  document.addEventListener("submit", function(event) {
    if (event.target && event.target.id === "loginForm") {
      handleLogin(event);
      return;
    }

    if (event.target && event.target.id === "bookingGateInForm") {
      handleBookingGateIn(event);
      return;
    }
  });

  document.addEventListener("click", function(event) {
    const actionTarget = event.target.closest("[data-action]");

    if (actionTarget) {
      const action = actionTarget.dataset.action;

      if (action === "logout") {
        handleLogout();
        return;
      }

      if (action === "back-dashboard") {
        navigateTo("");
        return;
      }

      if (action === "add-container-row") {
        addContainerRow();
        return;
      }

      if (action === "remove-container-row") {
        removeContainerRow(actionTarget);
        return;
      }
    }

    const routeTarget = event.target.closest("[data-route]");

    if (!routeTarget) {
      return;
    }

    const route = routeTarget.dataset.route || "";
    navigateTo(route);
  });


  // ============================================================
  // CLIENT ROUTER / BROWSER HISTORY
  // ============================================================

  function navigateTo(route, replaceHistory) {
    const normalizedRoute = String(route || "").trim();

    const url = buildRouteUrl(normalizedRoute);

    const historyState = {
      route: normalizedRoute
    };

    if (replaceHistory) {
      window.history.replaceState(
        historyState,
        "",
        url
      );
    } else {
      window.history.pushState(
        historyState,
        "",
        url
      );
    }

    renderRoute(normalizedRoute, false);
  }


  function renderRoute(route) {
    const normalizedRoute = String(route || "").trim();

    state.activeRoute = normalizedRoute;

    if (!normalizedRoute) {
      renderHome();
      return;
    }


    if (normalizedRoute === "booking-gate-in") {
      renderBookingGateIn();
      return;
    }


    if (normalizedRoute === "discharging-list") {

      console.log(
        "OPEN DISCHARGING:",
        typeof renderDischarging
      );


      if (
        typeof renderDischarging === "function"
      ) {

        renderDischarging();

      } else {

        console.error(
          "renderDischarging() tidak tersedia. " +
          "Pastikan DischargingView di-include di Index.html."
        );


        showToast(
          "Module Discharging gagal dimuat.",
          "error"
        );


        renderComingSoon(normalizedRoute);
      }

      return;
    }


    renderComingSoon(normalizedRoute);
  }


  function buildRouteUrl(route) {
    const url = new URL(window.location.href);

    if (route) {
      url.searchParams.set("route", route);
    } else {
      url.searchParams.delete("route");
    }

    return (
      url.pathname +
      url.search +
      url.hash
    );
  }


  function getRouteFromUrl() {
    try {
      const url = new URL(window.location.href);

      return String(
        url.searchParams.get("route") || ""
      ).trim();

    } catch (error) {
      console.warn(
        "Gagal membaca route dari URL:",
        error
      );

      return "";
    }
  }


  // ============================================================
  // BOOTSTRAP
  // ============================================================

  async function boot() {
    renderLoading();

    try {
      const response = await runServer("appBootstrap");

      if (!isSuccessResponse(response)) {
        throw new Error(
          response && response.message
            ? response.message
            : "Bootstrap gagal."
        );
      }

      const data = response.data || {};

      state.config = data.config || {};
      state.menus = Array.isArray(data.menus) ? data.menus : [];
      state.session = getStoredSession();

      console.log("APP BOOTSTRAP:", data);
      console.log("MENUS:", state.menus);

      if (state.session) {
        const initialRoute = getRouteFromUrl();

        window.history.replaceState(
          { route: initialRoute },
          "",
          buildRouteUrl(initialRoute)
        );

        renderRoute(initialRoute);

      } else {
        window.history.replaceState(
          { route: "" },
          "",
          buildRouteUrl("")
        );

        renderLogin();
      }

    } catch (error) {
      console.error("BOOT ERROR:", error);
      renderFatalError(error.message || "Aplikasi gagal dimuat.");
    }
  }


  // ============================================================
  // SERVER
  // ============================================================

  function runServer(functionName, ...args) {
    return new Promise(function(resolve, reject) {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function(error) {
          reject(
            new Error(
              error && error.message
                ? error.message
                : String(error)
            )
          );
        });

      runner[functionName](...args);
    });
  }


  // ============================================================
  // LOGIN
  // ============================================================

  async function handleLogin(event) {
    event.preventDefault();

    const form = event.target;

    const email = String(form.email.value || "")
      .trim()
      .toLowerCase();

    const password = String(form.password.value || "");
    const remember = Boolean(form.remember.checked);

    if (!email || !password) {
      showToast("Email dan password wajib diisi.", "error");
      return;
    }

    setLoginLoading(true);

    try {
      const response = await runServer(
        "loginOdoo",
        email,
        password,
        navigator.userAgent || ""
      );

      if (!isSuccessResponse(response)) {
        throw new Error(
          response && response.message
            ? response.message
            : "Login gagal."
        );
      }

      const data = response.data || {};

      if (!data.uid) {
        throw new Error(
          "Login gagal. ID user Odoo tidak ditemukan."
        );
      }

      saveSession({
        uid: String(data.uid),
        id: String(data.id || data.uid),
        email: email,
        partnerId: String(data.partnerId || ""),
        partnerName: String(data.partnerName || ""),
        partner_id: Array.isArray(data.partner_id)
          ? data.partner_id
          : [],
        passwordEncoded: encodeText(password),
        loginAt: new Date().toISOString()
      }, remember);

      state.session = getStoredSession();
      state.activeRoute = "";

      window.history.replaceState(
        { route: "" },
        "",
        buildRouteUrl("")
      );

      showToast(
        "Login berhasil. Selamat datang.",
        "success"
      );

      renderHome();

    } catch (error) {
      console.error("LOGIN ERROR:", error);

      showToast(
        error.message || "Login gagal.",
        "error"
      );

    } finally {
      setLoginLoading(false);
    }
  }


  function handleLogout() {
    resetDashboardBackGuard_();

    clearSession();

    state.session = null;
    state.activeRoute = "";

    window.history.replaceState(
      { route: "" },
      "",
      buildRouteUrl("")
    );

    renderLogin();

    showToast(
      "Anda sudah logout.",
      "success"
    );
  }

  // ============================================================
  // DASHBOARD
  // ============================================================

  function renderHome() {
    installDashboardBackGuard_();

    const config = state.config || {};
    const session = state.session || {};
    const menus = Array.isArray(state.menus)
      ? state.menus
      : [];

    console.log("=== RENDER HOME ===");
    console.log("STATE MENUS:", menus);

    console.table(
      menus.map(function(menu) {
        return {
          title: menu.Title,
          route: menu.Route,
          active: menu.IsActive,
          sort: menu.SortOrder
        };
      })
    );


    // ----------------------------------------------------------
    // FIND MENU
    // ----------------------------------------------------------

    function findMenu(route) {
      return menus.find(function(menu) {
        return String(menu.Route || "").trim() === route;
      });
    }


    // ----------------------------------------------------------
    // MENU CARD
    // ----------------------------------------------------------

    function buildMenuCard(menu) {
      if (!menu) {
        return "";
      }

      const title = escapeHtml(menu.Title || "-");
      const description = escapeHtml(menu.Description || "");
      const icon = escapeHtml(menu.Icon || "box");
      const route = escapeHtml(menu.Route || "");

      return `
        <button
          type="button"
          data-route="${route}"
          class="menu-card rounded-2xl border border-slate-200 bg-white p-5 text-left shadow-sm transition hover:-translate-y-1 hover:border-teal-200 hover:shadow-md"
        >

          <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-teal-50 text-teal-700">

            <i
              data-lucide="${icon}"
              class="h-7 w-7"
            ></i>

          </div>


          <h3 class="text-lg font-extrabold text-slate-950">
            ${title}
          </h3>


          <p class="mt-2 min-h-[3rem] text-sm leading-6 text-slate-500">
            ${description}
          </p>


          <div class="mt-5 flex items-center gap-2 text-sm font-bold text-teal-700">

            Buka menu

            <i
              data-lucide="arrow-right"
              class="h-4 w-4"
            ></i>

          </div>

        </button>
      `;
    }


    // ----------------------------------------------------------
    // GROUPING
    // ----------------------------------------------------------

    // SHIPPING AGENT
    const shippingAgentMenus = [
      findMenu("discharging-list")
    ].filter(Boolean);


    // BOOKING CONTAINER
    const bookingMenus = [
      findMenu("booking-gate-in"),
      findMenu("booking-gate-out")
    ].filter(Boolean);


    // ----------------------------------------------------------
    // HIDDEN MENUS
    // ----------------------------------------------------------
    // Sementara tidak ditampilkan di dashboard:
    //
    // - Stuffing Order
    // - Stripping Order
    // - Ambil Faktur Pajak
    //
    // Data menu tetap ada di Sheet Menus.
    // Hanya disembunyikan dari dashboard.
    // ----------------------------------------------------------

    const hiddenRoutes = [
      "stuffing-order",
      "stripping-order",
      "ambil-faktur-pajak"
    ];


    // ----------------------------------------------------------
    // OTHER MENUS
    // ----------------------------------------------------------
    // Kalau ada menu dari Sheet Menus yang belum masuk grouping,
    // tetap ditampilkan agar tidak "hilang".

    const knownRoutes = [
      "discharging-list",
      "booking-gate-in",
      "booking-gate-out",
      "stuffing-order",
      "stripping-order",
      "ambil-faktur-pajak"
    ];

    const otherMenus = menus.filter(function(menu) {
      const route = String(menu.Route || "").trim();

      return (
        route &&
        knownRoutes.indexOf(route) === -1 &&
        hiddenRoutes.indexOf(route) === -1
      );
    });


    // ----------------------------------------------------------
    // GROUP HTML
    // ----------------------------------------------------------

      title,
      description,
      icon,
      groupMenus
    ) {

              </p>

            </div>

              <div class="flex items-center gap-3">

                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-teal-400/15 text-teal-300">

                  <i
                    data-lucide="shield-check"

                  ></i>

                </div>


                <div>

                  <p class="text-sm text-slate-300">
                    Odoo User ID
                  </p>

                  <p class="text-2xl font-extrabold">
                    ${escapeHtml(session.uid || "-")}
                  </p>

                </div>

              </div>


              <div class="mt-5 rounded-2xl bg-white/5 p-4">

                <p class="text-xs text-slate-400">
                  Partner
                </p>

                </p>

                  Partner ID:
                  ${escapeHtml(session.partnerId || "-")}

              </div>

          <!-- MENU GROUPS -->

          ${menuGroupsHtml}

          ${emptyMenuHtml}


        </section>

      </main>
    `);

    refreshIcons();
  }


  // ============================================================
  // FATAL ERROR
  // ============================================================

  function renderFatalError(message) {
    setAppHtml(`
      <main class="port-bg min-h-screen flex items-center justify-center p-6">

        <section class="glass-panel max-w-lg rounded-[2rem] p-8 text-center shadow-soft soft-appear">

            <i
              data-lucide="triangle-alert"
              class="h-8 w-8"
            ></i>

          </div>


          <h1 class="text-2xl font-extrabold text-slate-950">
            Aplikasi gagal dimuat
          </h1>


          <p class="mt-3 text-sm leading-6 text-slate-500">
            ${escapeHtml(message)}
          </p>

        </section>

      </main>
    `);

    refreshIcons();
  }


  // ============================================================
  // LOGIN LOADING
  // ============================================================

  function setLoginLoading(isLoading) {
    const button =
      document.getElementById("loginButton");

    const buttonText =
      document.getElementById("loginButtonText");

    const buttonIcon =
      document.getElementById("loginButtonIcon");

    if (!button || !buttonText || !buttonIcon) {
      return;
    }

    button.disabled = Boolean(isLoading);

    buttonText.textContent =

        ? "Memvalidasi..."

  // ============================================================
  // SESSION
  // ============================================================

  function saveSession(session, remember) {
    const storage =
      remember
        ? localStorage
        : sessionStorage;

    const otherStorage =
      remember
        ? sessionStorage
        : localStorage;

    try {
      otherStorage.removeItem(STORAGE_KEY);

      storage.setItem(
        STORAGE_KEY,
        JSON.stringify(session)
      );

    } catch (error) {
      sessionStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(session)
      );
    }
  }


  function getStoredSession() {
    try {
      const rawSession =
        sessionStorage.getItem(STORAGE_KEY);

      const rawLocal =
        localStorage.getItem(STORAGE_KEY);

      const raw =
        rawSession || rawLocal;

      if (!raw) {
        return null;
      }

      const parsed = JSON.parse(raw);

      if (
        !parsed ||
        !parsed.email ||
        !parsed.uid
      ) {
        clearSession();
        return null;
      }

      return {
        uid: String(parsed.uid || ""),
        id: String(
          parsed.id ||
          parsed.uid ||
          ""
        ),
        email: String(parsed.email || ""),
        partnerId: String(parsed.partnerId || ""),
        partnerName: String(parsed.partnerName || ""),
        partner_id: Array.isArray(parsed.partner_id)
          ? parsed.partner_id
          : [],
        password: decodeText(
          parsed.passwordEncoded || ""
        ),
        passwordEncoded:
          parsed.passwordEncoded || "",
        loginAt:
          parsed.loginAt || ""
      };

    } catch (error) {
      console.error(
        "SESSION ERROR:",
        error
      );

      clearSession();
      return null;
    }
  }


  function clearSession() {
    try {
      sessionStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(STORAGE_KEY);

    } catch (error) {
      console.warn(
        "Gagal menghapus session:",
        error
      );
    }
  }

  // ============================================================

  function escapeHtml(value) {
    return String(
      value === undefined ||
      value === null
        ? ""
        : value
    )
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function encodeText(value) {
    try {
      return btoa(
        unescape(
          encodeURIComponent(
            String(value || "")
          )
        )
      );

    } catch (error) {
      return String(value || "");
    }
  }


  function decodeText(value) {
    try {
      return decodeURIComponent(
        escape(
          atob(
            String(value || "")
          )
        )
      );

    } catch (error) {
      return String(value || "");
    }
  }

  // ============================================================
  // SUBMIT GATE-IN
  // ============================================================

  async function handleBookingGateIn(event) {
    event.preventDefault();

    const form = event.target;
    const session = state.session || {};

    const containerInputs =
      form.querySelectorAll(
        "input[name='container[]']"
      );

    const containers =
      Array.from(containerInputs)
        .map(function(el) {
          return el.value
            .trim()
            .toUpperCase();
        })
        .filter(function(value) {
          return value !== "";
        });


    if (containers.length === 0) {
      showToast(
        "Minimal harus ada 1 nomor kontainer.",
        "error"
      );

      return;
    }


    const containerPattern =
      /^[A-Z]{4}\d{7}$/;


    const invalidContainers =
      containers.filter(function(container) {
        return !containerPattern.test(container);
      });


    if (invalidContainers.length > 0) {
      showToast(
        "Format kontainer tidak valid: " +
        invalidContainers.join(", "),
        "error"
      );

      return;
    }


    setGateInLoading(true);


    try {
      const formData = {
        containers: containers,
        customerName:
          session.partnerName || "",
        partnerId:
          session.partnerId || "",
        userEmail:
          session.email || "",
        uid:
          session.uid || ""
      };


      const response =
        await runServer(
          "apiCreateBookingGateIn",
          formData
        );


      if (!isSuccessResponse(response)) {
        throw new Error(
          response && response.message
            ? response.message
            : "Booking gagal."
        );
      }


      renderGateInResult(
        true,
        containers
      );


      showToast(
        "Booking Gate-In berhasil dikirim.",
        "success"
      );


    } catch (error) {

      console.error(
        "GATE-IN ERROR:",
        error
      );


      renderGateInResult(
        false,
        containers,
        error.message
      );


      showToast(
        error.message ||
        "Booking gagal.",
        "error"
      );


    } finally {
      setGateInLoading(false);
    }
  }
