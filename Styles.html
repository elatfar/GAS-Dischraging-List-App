<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

  body {
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .port-bg {
    background:
      radial-gradient(circle at top left, rgba(20, 184, 166, 0.35), transparent 32rem),
      radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.26), transparent 28rem),
      linear-gradient(135deg, #020617 0%, #0f172a 48%, #134e4a 100%);
  }

  .glass-panel {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.62);
  }

  .dark-glass {
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(22px);
    border: 1px solid rgba(148, 163, 184, 0.18);
  }

  .menu-card {
    transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
  }

  .menu-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 55px rgba(15, 23, 42, 0.14);
    border-color: rgba(20, 184, 166, 0.55);
  }

  .soft-appear {
    animation: softAppear 260ms ease both;
  }

  @keyframes softAppear {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .loader {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-top-color: #ffffff;
    border-radius: 999px;
    animation: spin 700ms linear infinite;
  }

  .loader.loader-sm {
    width: 14px;
    height: 14px;
    border-color: rgba(20, 184, 166, 0.35);
    border-top-color: #0d9488;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
